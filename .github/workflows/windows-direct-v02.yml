
name: PTT-Crosslink v0.2.1 Windows DIRECT EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js 22 installeren
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bibliotheken installeren
        run: npm install --no-audit --no-fund

      - name: Controller en audiorouter testen
        run: npm test

      - name: Windows portable EXE maken
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Windows EXE controleren
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist/*.exe -ErrorAction SilentlyContinue)) {
            throw 'Geen EXE gevonden'
          }

      - name: Downloadbare PTT-Crosslink EXE opslaan
        uses: actions/upload-artifact@v4
        with:
          name: PTT-Crosslink-v0.2.1-Windows-Direct
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
