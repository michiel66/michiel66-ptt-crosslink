
name: PTT-Crosslink v0.2 Windows DIRECT EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PTT-Crosslink v0.2
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: 'x64'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run crosslink tests
        run: npm test

      - name: Build Windows portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Check Windows EXE
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist/*.exe -ErrorAction SilentlyContinue)) {
            throw "PTT-Crosslink EXE niet gevonden!"
          }
          Write-Host "Windows EXE succesvol gebouwd!"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PTT-Crosslink-v0.2-Windows-Direct
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
